name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Diagram tooling (archify) must never phone home from CI.
      ARCHIFY_UPDATE_CHECK_DISABLED: "1"
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Syntax check all JS files
        run: |
          node -c cli/src/cli.js
          node -c cli/src/client.js
          node -c bridge/bridge.js
          node -c mcp/src/server.js
          node -c mcp/src/tools.js
          node -c extension/src/background.js
          node -c extension/src/thread-utils.js

      - name: Run CLI/bridge integration tests (mock)
        run: npm test

      - name: Run bridge authentication tests (real bridge process)
        run: npm run test:bridge-auth

      - name: Run bridge browser-origin tests (real bridge process)
        run: npm run test:bridge-security

      - name: Run extension background-script tests (mocked messenger API)
        run: npm run test:extension

      - name: Run XPI signing tests (mock ATN API)
        run: npm run test:sign

      - name: Run docs consistency tests (tb --help vs docs, diagrams)
        run: npm run test:docs

      - name: Run MCP server integration tests (mock)
        run: npm run test:mcp

      - name: Check npm package contents (npm pack --dry-run)
        run: npm run test:pack

      - name: Smoke-test the packed tarball (global install into a temp prefix)
        run: npm run test:pack-smoke
