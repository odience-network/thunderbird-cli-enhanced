name: release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Check tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "v$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Run tests
        run: |
          npm test
          npm run test:mcp
          npm run test:pack
          npm run test:pack-smoke

      - name: Build unsigned XPI
        run: npm run build:xpi

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Find signed XPI
        id: xpi
        run: |
          # The Thunderbird extension version (in manifest.json) is independent of
          # the npm/release version. We attach whichever signed XPI is in dist/releases/.
          SIGNED_XPI=$(find dist/releases -name "*-tb.xpi" -type f | sort -V | tail -1)
          if [ -z "$SIGNED_XPI" ]; then
            echo "::error::No signed XPI found in dist/releases/"
            echo "Expected: dist/releases/*-tb.xpi"
            echo "Upload an ATN-signed XPI to dist/releases/ before tagging."
            exit 1
          fi
          echo "signed=$SIGNED_XPI" >> "$GITHUB_OUTPUT"
          echo "Found signed XPI: $SIGNED_XPI"
          UNSIGNED_XPI=$(find dist -maxdepth 1 -name "thunderbird-cli-*.xpi" -type f | sort -V | tail -1)
          echo "unsigned=$UNSIGNED_XPI" >> "$GITHUB_OUTPUT"
          echo "Found unsigned XPI: $UNSIGNED_XPI"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: v${{ steps.version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## thunderbird-cli v${{ steps.version.outputs.version }}

            ### Install the Thunderbird extension

            Download the attached **`*-tb.xpi`** (signed by Mozilla via addons.thunderbird.net; the extension has its own version number) and install via:
            1. Thunderbird → **Add-ons and Themes**
            2. ⚙ gear icon → **Install Add-on From File…**
            3. Select the downloaded `.xpi`

            ### Install the CLI and MCP server

            ```bash
            git clone https://github.com/odience-network/thunderbird-cli-enhanced
            cd thunderbird-cli-enhanced
            npm install
            ```

            See [docs/SETUP.md](https://github.com/odience-network/thunderbird-cli-enhanced/blob/v${{ steps.version.outputs.version }}/docs/SETUP.md) for the full setup guide.

            ### Changelog

            See [CHANGELOG.md](https://github.com/odience-network/thunderbird-cli-enhanced/blob/v${{ steps.version.outputs.version }}/CHANGELOG.md) for details.
          files: |
            ${{ steps.xpi.outputs.signed }}
            ${{ steps.xpi.outputs.unsigned }}

  # Publishes @odience-network/thunderbird-cli-enhanced to npmjs, only after the
  # tests above passed. Auth is npm trusted publishing (OIDC, no stored token).
  # The `npm` environment can require a reviewer before this job runs.
  # Rollback: docs/RELEASING.md.
  npm-publish:
    needs: release
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      # No NODE_AUTH_TOKEN: npm swaps the OIDC token for a publish token itself.
      # No cache either: a poisoned cache must never run next to the OIDC token.
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1.
      - name: Upgrade npm
        run: npm install -g npm@11

      - name: Publish
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm, nothing to publish."
            exit 0
          fi
          # Pre-releases (1.2.0-rc.1) go to the `next` dist-tag, never `latest`.
          TAG=latest
          case "$VERSION" in *-*) TAG=next ;; esac
          npm publish --provenance --access public --tag "$TAG"
